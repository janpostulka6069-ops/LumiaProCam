name: Build LumiaProCam ARM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore and Build
      run: |
        msbuild LumiaProCam.csproj /t:Restore /p:Platform=ARM /p:Configuration=Release
        msbuild LumiaProCam.csproj /p:Configuration=Release /p:Platform=ARM /p:AppxBundle=Always /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LumiaProCam-ARM
        path: AppPackages/**
